name: Nova Poshta Duplicates Check

on:
  schedule:
    - cron: "10 14 * * *"   # 17:10 за Києвом (літо, UTC+3)
      timezone: "Europe/Kyiv"
  workflow_dispatch: # дозволяє запустити вручну кнопкою "Run workflow" на GitHub

jobs:
  check-duplicates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run duplicate check
        env:
          NP_API_KEY: ${{ secrets.NP_API_KEY }}
          NP_TOKEN: ${{ secrets.NP_TOKEN }}
          NP_DEVICE_CODE: ${{ secrets.NP_DEVICE_CODE }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: node check-duplicates.js

      - name: Upload HTML report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: duplicates-report
          path: duplicates-report.html
