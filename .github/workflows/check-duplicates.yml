name: Nova Poshta Duplicates Check

on:
  schedule:
    # Cron у UTC. Ранній запуск готує завдання, скрипт чекає до 17:00 за Києвом.
    - cron: "7,37 8,9 * * *"
    # 14:00 UTC = 17:00 влітку; 15:00 UTC = 17:00 взимку.
    - cron: "0 14,15 * * *"
    - cron: "10,30 14,15 * * *"
  workflow_dispatch: # дозволяє запустити вручну кнопкою "Run workflow" на GitHub

permissions:
  contents: read
  actions: read

concurrency:
  group: nova-poshta-duplicates
  cancel-in-progress: false

jobs:
  check-duplicates:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run duplicate check
        env:
          NP_TOKEN: ${{ secrets.NP_TOKEN }}
          NP_DEVICE_CODE: ${{ secrets.NP_DEVICE_CODE }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          GH_TOKEN: ${{ github.token }}
        run: node check-duplicates.js

      - name: Upload HTML report as artifact
        if: ${{ hashFiles('duplicates-report.html') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: duplicates-report
          path: duplicates-report.html
